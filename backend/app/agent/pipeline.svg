<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="700" viewBox="0 0 1040 700" font-family="Inter, 'Segoe UI', system-ui, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#5B6B7C"/>
    </marker>
    <marker id="arrowRetry" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#C2410C"/>
    </marker>
    <marker id="arrowOk" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#15803D"/>
    </marker>
  </defs>

  <rect width="1040" height="700" fill="#0A1A0F"/>

  <text x="40" y="46" fill="#E8F5EC" font-size="23" font-weight="700">Team split pipeline</text>
  <text x="40" y="70" fill="#7FA48C" font-size="13.5">LangGraph StateGraph — the model judges players, a solver assigns teams</text>

  <!-- legend -->
  <g transform="translate(700,34)">
    <rect x="0" y="0" width="14" height="14" rx="3" fill="#1B2E4A" stroke="#4F8FD6" stroke-width="1.5"/>
    <text x="21" y="11.5" fill="#9FC4E8" font-size="12">LLM call</text>
    <rect x="0" y="22" width="14" height="14" rx="3" fill="#13291C" stroke="#3DDB6A" stroke-width="1.5"/>
    <text x="21" y="33.5" fill="#8FD8A8" font-size="12">deterministic</text>
  </g>

  <!-- 1 load -->
  <g transform="translate(60,104)">
    <rect width="290" height="60" rx="9" fill="#13291C" stroke="#3DDB6A" stroke-width="1.6"/>
    <text x="16" y="25" fill="#E8F5EC" font-size="14.5" font-weight="600">load players</text>
    <text x="16" y="45" fill="#7FA48C" font-size="11.5">registrations → payloads + composite scores</text>
  </g>
  <path d="M 205 164 L 205 196" stroke="#5B6B7C" stroke-width="1.8" fill="none" marker-end="url(#arrow)"/>

  <!-- 2 extract -->
  <g transform="translate(60,196)">
    <rect width="290" height="86" rx="9" fill="#1B2E4A" stroke="#4F8FD6" stroke-width="1.6"/>
    <text x="16" y="25" fill="#E8F5EC" font-size="14.5" font-weight="600">extract_judgments</text>
    <text x="16" y="45" fill="#9FC4E8" font-size="11.5">forced tool call → per-player rating</text>
    <text x="16" y="62" fill="#9FC4E8" font-size="11.5">+ balance weights. Never names a team.</text>
    <text x="16" y="79" fill="#6E93B8" font-size="11">~16–25s</text>
  </g>
  <path d="M 205 282 L 205 314" stroke="#5B6B7C" stroke-width="1.8" fill="none" marker-end="url(#arrow)"/>

  <!-- 3 validate -->
  <g transform="translate(60,314)">
    <rect width="290" height="86" rx="9" fill="#13291C" stroke="#3DDB6A" stroke-width="1.6"/>
    <text x="16" y="25" fill="#E8F5EC" font-size="14.5" font-weight="600">validate_judgments</text>
    <text x="16" y="45" fill="#7FA48C" font-size="11.5">every player present &amp; on roster?</text>
    <text x="16" y="62" fill="#7FA48C" font-size="11.5">ratings clamped to ±2.0 of composite</text>
    <text x="16" y="79" fill="#5C8A70" font-size="11">the only branching node</text>
  </g>

  <!-- retry edge -->
  <path d="M 60 350 L 34 350 L 34 239 L 60 239" stroke="#C2410C" stroke-width="1.8" fill="none"
        stroke-dasharray="5,4" marker-end="url(#arrowRetry)"/>
  <text x="14" y="300" fill="#E0813F" font-size="10.5" transform="rotate(-90 14 300)">retry once, error fed back</text>

  <!-- degrade -->
  <path d="M 350 357 L 404 357" stroke="#C2410C" stroke-width="1.8" fill="none" stroke-dasharray="5,4" marker-end="url(#arrowRetry)"/>
  <text x="377" y="345" fill="#E0813F" font-size="10.5" text-anchor="middle">2nd failure</text>
  <g transform="translate(404,326)">
    <rect width="212" height="62" rx="9" fill="#2A1C12" stroke="#C2410C" stroke-width="1.6"/>
    <text x="14" y="24" fill="#F0C9A8" font-size="14" font-weight="600">degrade</text>
    <text x="14" y="44" fill="#C9966B" font-size="11.5">fall back to raw composites</text>
  </g>

  <!-- ok edge to solve -->
  <path d="M 205 400 L 205 436" stroke="#15803D" stroke-width="1.8" fill="none" marker-end="url(#arrowOk)"/>
  <text x="214" y="422" fill="#3DDB6A" font-size="11">valid</text>
  <path d="M 510 388 L 510 414 L 300 414 L 300 436" stroke="#C2410C" stroke-width="1.8" fill="none"
        stroke-dasharray="5,4" marker-end="url(#arrowRetry)"/>

  <!-- 4 solve -->
  <g transform="translate(60,436)">
    <rect width="290" height="92" rx="9" fill="#13291C" stroke="#3DDB6A" stroke-width="2.2"/>
    <text x="16" y="26" fill="#E8F5EC" font-size="14.5" font-weight="600">solve</text>
    <text x="16" y="46" fill="#7FA48C" font-size="11.5">exhaustive search ≤22 players</text>
    <text x="16" y="63" fill="#7FA48C" font-size="11.5">cost = strength + stars + positions</text>
    <text x="16" y="83" fill="#3DDB6A" font-size="11" font-weight="600">24 ms · provably optimal</text>
  </g>
  <path d="M 205 528 L 205 560" stroke="#5B6B7C" stroke-width="1.8" fill="none" marker-end="url(#arrow)"/>

  <!-- 5 explain -->
  <g transform="translate(60,560)">
    <rect width="290" height="86" rx="9" fill="#1B2E4A" stroke="#4F8FD6" stroke-width="1.6"/>
    <text x="16" y="25" fill="#E8F5EC" font-size="14.5" font-weight="600">explain</text>
    <text x="16" y="45" fill="#9FC4E8" font-size="11.5">receives the finished split as input</text>
    <text x="16" y="62" fill="#9FC4E8" font-size="11.5">describes it — cannot change it</text>
    <text x="16" y="79" fill="#6E93B8" font-size="11">~5–13s · best-effort</text>
  </g>

  <!-- right panel -->
  <g transform="translate(648,104)">
    <rect width="332" height="196" rx="10" fill="#111D14" stroke="#24402D" stroke-width="1.4"/>
    <text x="18" y="28" fill="#E8F5EC" font-size="13.5" font-weight="700">Why this ordering</text>
    <text x="18" y="54" fill="#93AF9E" font-size="11.5">The old pipeline asked for teams and</text>
    <text x="18" y="71" fill="#93AF9E" font-size="11.5">reasoning in one response, so the two</text>
    <text x="18" y="88" fill="#93AF9E" font-size="11.5">could disagree — and did, in 4 of 5 runs</text>
    <text x="18" y="105" fill="#93AF9E" font-size="11.5">on a real 14-player event (#30).</text>
    <text x="18" y="132" fill="#93AF9E" font-size="11.5">Here the split is fixed before any text</text>
    <text x="18" y="149" fill="#93AF9E" font-size="11.5">is written, so the explanation cannot</text>
    <text x="18" y="166" fill="#93AF9E" font-size="11.5">contradict the teams. The failure mode</text>
    <text x="18" y="183" fill="#3DDB6A" font-size="11.5" font-weight="600">is removed, not detected.</text>
  </g>

  <g transform="translate(648,326)">
    <rect width="332" height="320" rx="10" fill="#111D14" stroke="#24402D" stroke-width="1.4"/>
    <text x="18" y="28" fill="#E8F5EC" font-size="13.5" font-weight="700">Measured — 14 players</text>

    <text x="18" y="58" fill="#6E8A78" font-size="11">strength gap</text>
    <text x="180" y="58" fill="#93AF9E" font-size="11">old 1.79 avg</text>
    <text x="272" y="58" fill="#3DDB6A" font-size="11" font-weight="600">new 0.00–0.06</text>

    <text x="18" y="80" fill="#6E8A78" font-size="11">stars stacked</text>
    <text x="180" y="80" fill="#93AF9E" font-size="11">old 4 of 5</text>
    <text x="272" y="80" fill="#3DDB6A" font-size="11" font-weight="600">new 0 of 4</text>

    <text x="18" y="102" fill="#6E8A78" font-size="11">reasoning true</text>
    <text x="180" y="102" fill="#93AF9E" font-size="11">old 1 of 5</text>
    <text x="272" y="102" fill="#3DDB6A" font-size="11" font-weight="600">always</text>

    <line x1="18" y1="120" x2="314" y2="120" stroke="#24402D" stroke-width="1.2"/>

    <text x="18" y="146" fill="#E8F5EC" font-size="13.5" font-weight="700">The division of labour</text>
    <text x="18" y="172" fill="#93AF9E" font-size="11.5">The model reads what numbers cannot:</text>
    <text x="18" y="192" fill="#7FA48C" font-size="11.5">“does not track back”</text>
    <text x="220" y="192" fill="#E0813F" font-size="11.5">→ 8.13 ↓ 7.50</text>
    <text x="18" y="212" fill="#7FA48C" font-size="11.5">“can change a game”</text>
    <text x="220" y="212" fill="#3DDB6A" font-size="11.5">→ 8.52 ↑ 9.50</text>
    <text x="18" y="232" fill="#7FA48C" font-size="11.5">“lack of vision”</text>
    <text x="220" y="232" fill="#E0813F" font-size="11.5">→ 5.43 ↓ 5.00</text>

    <text x="18" y="262" fill="#93AF9E" font-size="11.5">The solver does what the model cannot:</text>
    <text x="18" y="282" fill="#93AF9E" font-size="11.5">search 3,432 combinations exactly, in</text>
    <text x="18" y="299" fill="#93AF9E" font-size="11.5">24 ms, without contradicting itself.</text>
  </g>
</svg>
